# The cicd-ref-arch pipeline for an enrolled app in its own repo (docs/enroll.md). `tools/enroll.py`
# installs this as .forgejo/workflows/cicd.yaml and sets what it needs on the app repo:
#   variable CICD_BOT_USER, secret CICD_BOT_TOKEN  - may push to the state repo
#   variable CICD_CLUSTER                          - which cluster's environments to write
# The app's developers own everything else in the repo: code, tests, Dockerfile, deploy/, cicd.yaml
# and the suppression records in security/. The platform decides build, scans, gates and deploys.
#
#   push to the dev branch  -> test, build, scan, deploy dev     https://<app>-dev.<cluster>.<zone>/
#   push to another branch  -> the same at https://<app>-<branch>.<cluster>.<zone>/, unless the
#                              branch is paused or the tenant is at its branch limit (default 16)
#   delete a branch         -> its environment is removed
#
# Self-service (from the dashboard, or Actions -> cicd -> Run workflow): anyone with write on this
# repo can pause, resume or remove a branch environment, or request a promotion to prod. They are
# recorded as the one who asked; prod still needs someone else to approve.
name: cicd
on:
  push:
  delete:
  workflow_dispatch:
    inputs:
      action: {description: "deploy | pause | resume | remove-env | request-promotion", default: deploy}
      branch: {description: "the branch to act on (default: the branch this runs on)", default: ""}
      not_before: {description: "request-promotion: earliest UTC time, e.g. 2026-11-20T15:00:00Z", default: ""}
      reason: {description: "request-promotion: why", default: ""}

env:
  APP: .                    # where cicd.yaml is, relative to the repo root
  CLUSTER: ${{ vars.CICD_CLUSTER || 'c-local' }}
  CICD_REPO: ffwf/cicd-ref-arch
  CICD_REF: master          # pin a tag once the platform has releases

jobs:
  # does this push go through CI/CD? (excluded branches, paused branches, the tenant's limit)
  route:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.action == '' || inputs.action == 'deploy'))
    runs-on: ffwf-k8s
    outputs:
      env: ${{ steps.route.outputs.env }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with: {repository: "${{ env.CICD_REPO }}", ref: "${{ env.CICD_REF }}", path: .cicd}
    - uses: ./.cicd/actions/setup
    - id: route
      env:
        BRANCH: ${{ github.ref_name }}
      run: |
        env=$(python3 .cicd/tools/cicd.py --root .cicd which-env "$APP/cicd.yaml" --branch "$BRANCH" --cluster "$CLUSTER")
        echo "env=$env" >> "$GITHUB_OUTPUT"
        case "$env" in
          skip-paused) echo "::notice::branch $BRANCH is paused: no CI/CD until it is resumed" ;;
          skip-limit)  echo "::notice::the tenant is at its branch limit: $BRANCH waits for a free slot (pause or remove another branch)" ;;
          skip)        echo "::notice::branch $BRANCH is excluded in cicd.yaml" ;;
        esac

  test:
    needs: route
    if: "!startsWith(needs.route.outputs.env, 'skip-')"
    runs-on: ffwf-k8s
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with: {repository: "${{ env.CICD_REPO }}", ref: "${{ env.CICD_REF }}", path: .cicd}
    - uses: ./.cicd/actions/setup
    - uses: ./.cicd/actions/test
      with: {app: "${{ env.APP }}"}
    - if: always()
      uses: actions/upload-artifact@v3
      with: {name: ci-result-test, path: ci-result/}

  deliver:
    needs: [route, test]
    if: needs.route.outputs.env == 'dev' || needs.route.outputs.env == 'branch'
    runs-on: ffwf-k8s
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with: {repository: "${{ env.CICD_REPO }}", ref: "${{ env.CICD_REF }}", path: .cicd}
    - uses: ./.cicd/actions/setup
    - id: build
      uses: ./.cicd/actions/build
      with: {app: "${{ env.APP }}", cluster: "${{ env.CLUSTER }}"}
    - id: security
      uses: ./.cicd/actions/security
      with: {app: "${{ env.APP }}", env: "${{ needs.route.outputs.env }}", image: "${{ steps.build.outputs.image }}"}
    - uses: ./.cicd/actions/sign
      with: {image: "${{ steps.build.outputs.image }}", out: build/security}
    - uses: ./.cicd/actions/deploy-env
      with:
        app: ${{ env.APP }}
        cluster: ${{ env.CLUSTER }}
        env: ${{ needs.route.outputs.env }}
        branch: ${{ github.ref_name }}
        image: ${{ steps.build.outputs.image }}
        manifests: build/app.yaml
        token: ${{ secrets.CICD_BOT_TOKEN }}
        user: ${{ vars.CICD_BOT_USER }}
        state-repo: ${{ env.CICD_REPO }}
    - if: always()
      uses: actions/upload-artifact@v3
      with: {name: deliver, path: "build/security/\nbuild/app.yaml\nbuild/build-metadata.json"}

  # self-service, for whoever dispatched it (they have write on this repo, or they couldn't)
  manage:
    if: github.event_name == 'workflow_dispatch' && inputs.action != '' && inputs.action != 'deploy'
    runs-on: ffwf-k8s
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with: {repository: "${{ env.CICD_REPO }}", ref: "${{ env.CICD_REF }}", path: .cicd}
    - uses: ./.cicd/actions/setup
    - id: app
      run: echo "name=$(python3 -c "import yaml,sys;print(yaml.safe_load(open(sys.argv[1]))['metadata']['name'])" "$APP/cicd.yaml")" >> "$GITHUB_OUTPUT"
    - if: inputs.action == 'request-promotion'
      uses: ./.cicd/actions/request-promotion
      with:
        app: ${{ steps.app.outputs.name }}
        not-before: ${{ inputs.not_before }}
        reason: ${{ inputs.reason }}
        requested-by: ${{ github.actor }}
        cluster: ${{ env.CLUSTER }}
        token: ${{ secrets.CICD_BOT_TOKEN }}
        user: ${{ vars.CICD_BOT_USER }}
        state-repo: ${{ env.CICD_REPO }}
    - if: inputs.action != 'request-promotion'
      uses: ./.cicd/actions/manage-env
      with:
        action: ${{ inputs.action }}
        app: ${{ env.APP }}
        branch: ${{ inputs.branch || github.ref_name }}
        by: ${{ github.actor }}
        cluster: ${{ env.CLUSTER }}
        token: ${{ secrets.CICD_BOT_TOKEN }}
        user: ${{ vars.CICD_BOT_USER }}
        state-repo: ${{ env.CICD_REPO }}

  # a deleted branch: ask the platform to remove its environment now instead of within 5 minutes
  cleanup:
    if: github.event_name == 'delete'
    runs-on: ffwf-k8s
    steps:
    - env:
        TOKEN: ${{ secrets.CICD_BOT_TOKEN }}
      run: |
        curl -fsS -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
          -d '{"ref": "master"}' \
          '${{ github.server_url }}/api/v1/repos/${{ env.CICD_REPO }}/actions/workflows/environments.yaml/dispatches'
        echo "asked ${{ env.CICD_REPO }} to remove environments of deleted branches"
